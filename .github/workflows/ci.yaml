name: Continuous Integration & Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff bandit pytest pytest-asyncio pytest-cov

      - name: Python Code Linting (Ruff)
        run: |
          ruff check backend/ worker/

      - name: Security Scanning (Bandit)
        run: |
          bandit -r backend/ worker/ -ll -ii

      - name: Run Test Suite
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          MOCK_BEDROCK: "True"
          STORAGE_BACKEND: local
          LOCAL_STORAGE_DIR: ./data/test_uploads
          ASYNC_PROCESSING_MODE: inline
          ENVIRONMENT: dev
        run: |
          pytest -v --cov=backend/app --cov-report=term-missing tests/

  terraform-validate:
    name: Terraform Format & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Validate Terraform Format
        run: |
          terraform fmt -check -recursive infrastructure/terraform/

  container-scan:
    name: Container Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: |
          docker build -t agentic-rag-backend:test -f backend/Dockerfile backend/

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "agentic-rag-backend:test"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
