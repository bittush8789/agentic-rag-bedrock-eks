apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agentic-rag-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/myorg/agentic-rag-eks.git
    targetRevision: main
    path: deploy/helm/agentic-rag
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: agentic-rag
  syncPolicy:
    # Production enforces manual operator approval for deployment sync
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
