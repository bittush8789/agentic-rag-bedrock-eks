apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentic-rag-backend-sa
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/component: backend
    {{- include "agentic-rag.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentic-rag-worker-sa
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/component: worker
    {{- include "agentic-rag.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentic-rag-frontend-sa
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/component: frontend
    {{- include "agentic-rag.labels" . | nindent 4 }}
